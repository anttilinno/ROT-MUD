[[rooms]]
vnum = 29600
name = "The Crossroads Beneath the Temple"
sector = "inside"
room_flags = ["safe", "indoors", "no_mob"]
description = """
A vaulted crypt lies hidden beneath the Temple of Thoth. Six sealed paths
once led from here to powers older than the gods of the temple above; now
the seals are broken. Heat breathes from the north, grave-cold from the
east, the smell of wet pine and fur from the south, and a hum of raw magic
from the west. Worn stairs lead up to the temple and down into the dark."""

