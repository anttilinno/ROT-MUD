# Class help entries

[[help]]
keywords = ["classes", "class"]
description = """
Rivers of Time features character classes in two tiers:

TIER 1 (Starting Classes):
  Mage      - Master of arcane magic, low HP, high mana
  Cleric    - Divine spellcaster, healing and protection
  Thief     - Stealth and cunning, backstab specialist
  Warrior   - Combat master, highest HP and attacks
  Ranger    - Wilderness expert, nature magic
  Druid     - Nature priest, shapeshifting and healing
  Ghoul     - Blood-bound servant of the undead, feeds on blood

TIER 2 (Supernatural Classes - see 'help reroll'):
  Demon      - Pact-bound fiend; hellfire, wings, demonic armour
  Vampire    - Embraced ghoul; disciplines of blood (ghouls only)
  Werewolf   - Survivor of the bite; gifts of the wild, war form
  Magus      - Awakened mage; spheres of forces, life and mind
  Highlander - Immortal swordsman; katas and the quickening
  Angel      - Raised among the host; holy fire, wings, glory

Use 'help <classname>' for details on each class.
"""
see_also = ["races", "score"]

[[help]]
keywords = ["mage"]
description = """
MAGE - Master of Arcane Magic

Mages are the primary offensive spellcasters in Rivers of Time. They
command devastating attack spells like fireball, lightning bolt, and
chain lightning. Their physical combat abilities are limited, but
their magical prowess is unmatched.

Prime Attribute: Intelligence
Hit Points: Low (6-6 per level)
Mana: High (8 per level)

Strengths:
  - Most powerful offensive magic
  - Wide variety of utility spells
  - Identify and enchantment spells

Weaknesses:
  - Lowest hit points
  - Poor combat skills
  - Light armor only

Key Skills: scrolls, staves, wands, meditation
Key Spells: magic missile, fireball, lightning bolt, enchant weapon
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["cleric"]
description = """
CLERIC - Divine Spellcaster

Clerics serve the gods and channel divine power for healing, protection,
and smiting the undead. They are the primary healers and supporters in
any group, but can also fight effectively with maces and flails.

Prime Attribute: Wisdom
Hit Points: Medium (7-10 per level)
Mana: Medium (2 per level)

Strengths:
  - Best healing spells
  - Protection and blessing magic
  - Can wear medium armor
  - Effective against undead

Weaknesses:
  - Limited offensive magic
  - Cannot use edged weapons (lore)
  - Moderate combat abilities

Key Skills: mace, flail, shield block, rescue
Key Spells: cure light/serious/critical, heal, sanctuary, bless
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["thief"]
description = """
THIEF - Master of Stealth

Thieves excel at stealth, deception, and striking from the shadows.
The backstab ability allows them to deal massive damage to unsuspecting
foes. They can also pick locks, steal items, and move unseen.

Prime Attribute: Dexterity
Hit Points: Medium (8-13 per level)
Mana: None

Strengths:
  - Deadly backstab attack
  - Stealth abilities (sneak, hide)
  - Pick locks and steal
  - High dodge capability

Weaknesses:
  - No magic ability
  - Light armor only
  - Poor sustained combat

Key Skills: backstab, sneak, hide, steal, pick lock, dodge, circle
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["warrior"]
description = """
WARRIOR - Combat Master

Warriors are the ultimate combat specialists. They gain the most attacks
per round, the highest hit points, and can use any weapon and armor.
While they lack magic, their combat prowess is unmatched.

Prime Attribute: Strength
Hit Points: Highest (13-18 per level)
Mana: None

Strengths:
  - Most attacks per round (up to 5)
  - Highest hit points
  - All weapons and armor
  - Bash and berserk abilities

Weaknesses:
  - No magic at all
  - Limited utility skills

Key Skills: second/third/fourth/fifth attack, bash, berserk, rescue,
           enhanced damage, parry, shield block
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["ranger"]
description = """
RANGER - Wilderness Expert

Rangers are warriors of the wild, combining combat skills with nature
magic. They can track foes, befriend animals, and call upon natural
forces to aid them in battle.

Prime Attribute: Strength
Hit Points: Medium-High (9-13 per level)
Mana: Low

Strengths:
  - Dual wield capability
  - Tracking ability
  - Nature spells
  - Good in outdoor environments

Weaknesses:
  - Jack of all trades, master of none
  - Less magic than pure casters
  - Less combat than warriors

Key Skills: track, dual wield, enhanced damage
Key Spells: call lightning, cure spells, pass door
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["druid"]
description = """
DRUID - Nature Priest

Druids are priests of nature, wielding elemental magic and drawing
power from the natural world. They combine healing abilities with
offensive nature spells.

Prime Attribute: Wisdom
Hit Points: Medium (7-10 per level)
Mana: Medium

Strengths:
  - Nature and elemental magic
  - Healing abilities
  - Control weather
  - Good outdoor combat

Weaknesses:
  - Less powerful than clerics for healing
  - Less powerful than mages for damage
  - Restricted armor choices

Key Skills: meditation
Key Spells: earthquake, call lightning, cure spells, control weather
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["ghoul"]
description = """
GHOUL - Blood-Bound Servant

Ghouls are mortals bound to the undead by blood. They sustain
themselves by feeding on the blood of the living and share many of
their masters' dark powers and weaknesses.

Prime Attribute: Constitution
Hit Points: Low-Medium (6-8 per level)
Mana: Low

Strengths:
  - Feed ability restores health
  - Dark magic powers
  - Enhanced night vision
  - Undead resistances

Weaknesses:
  - Must feed regularly
  - Vulnerable to sunlight
  - Holy damage vulnerability
  - Cannot enter some areas

Key Skills: feed
Key Spells: animate, energy drain, harm
"""
see_also = ["reroll", "classes"]

[[help]]
keywords = ["demon", "tier 2"]
description = """
DEMON - Pact-Bound Fiend (Tier 2 Class)

Demons are heroes who sealed a pact with the demon lord. They restart at
level 1 but keep every skill of their mortal class. They buy infernal
gifts with demonic power and alone may wear demonic armour (see 'help
demonarmour'). Demons resist fire but holy power burns them.

Prime Attribute: Strength
Requirement: Reroll at level 101, then complete the demon lord's pact
Currency: demonic power (earned from kills; see 'help powers')
Barred races: heucuva, avian, pixie.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["vampire"]
description = """
VAMPIRE - Kindred of the Blood (Tier 2 Class)

Only a ghoul may receive the Embrace. Vampires master disciplines:
celerity, fortitude, potence, auspex, protean, obfuscate, and at last
the bloodrage. Fire and silver are their bane; poison and negative
energy barely touch them.

Prime Attribute: Constitution
Requirement: Reroll at level 101, then receive the elder's Embrace (ghouls only)
Currency: blood (earned from kills; see 'help powers')
Barred races: heucuva, titan, giant.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["werewolf", "garou"]
description = """
WEREWOLF - Child of the Moon (Tier 2 Class)

Those who survive the great wolf's bite gain gifts of the wild: claws,
keen senses, iron hide, and the towering crinos war form. Silver burns
them.

Prime Attribute: Strength
Requirement: Reroll at level 101, then survive the great wolf's hunt
Currency: rage (earned from kills; see 'help powers')
Barred races: heucuva, pixie, avian, kenku.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["magus", "awakened"]
description = """
MAGUS - The Awakened (Tier 2 Class)

A magus has seen through the world to the quintessence beneath. The
spheres of forces, life, mind, prime and correspondence bend reality
to their will.

Prime Attribute: Intelligence
Requirement: Reroll at level 101, then pass the archmagus' awakening
Currency: quintessence (earned from kills; see 'help powers')
Barred races: minotaur, gnoll, giant.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["highlander", "immortal swordsman"]
description = """
HIGHLANDER - The Immortal Blade (Tier 2 Class)

Highlanders cannot die of age and live for the duel. Their katas
sharpen blade and body, and the quickening turns them into a storm of
steel.

Prime Attribute: Strength
Requirement: Reroll at level 101, then claim the swordmaster's quickening
Currency: quickening (earned from kills; see 'help powers')
Barred races: heucuva, pixie.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["angel", "seraph"]
description = """
ANGEL - Raised Among the Host (Tier 2 Class)

Angels are the mirror of demons: wings, holy fire and a glory that
blinds. Holy power cannot harm them, but negative energy can.

Prime Attribute: Wisdom
Requirement: Reroll at level 101, then complete the seraph's crusade
Currency: grace (earned from kills; see 'help powers')
Barred races: heucuva, goblin, gnoll, halforc.
"""
see_also = ["reroll", "powers", "rite", "classes"]

[[help]]
keywords = ["reroll", "remort", "tier 2"]
description = """
REROLL - Ascending to Tier 2

At level 101 (Hero) you may type 'reroll confirm' to turn your back on
mortal classes. Rerolling alone changes nothing; you must then complete
the rite of a Tier 2 class. When the rite is complete:

- You become that class and restart at level 1
- You keep every skill and spell your mortal class learned
- Some races are barred from some rites

Rites are performed in the Hall of Rites, down the stair behind the
altar of the Temple of Thoth. Talk to a master with 'rite', take the rite
with 'rite begin', and return with 'rite complete' once its deed is done.

Tier 2 classes and their rites:
  Demon      - slay ten good creatures (level 50+)
  Vampire    - drain ten victims (level 50+) at night; ghouls only
  Werewolf   - hunt ten creatures (level 50+) at night
  Magus      - defeat ten spellcasters (level 50+)
  Highlander - best ten warriors (level 50+)
  Angel      - cast down ten evil creatures (level 50+)

Rerolling cannot be undone.
"""
see_also = ["classes", "rite", "powers"]

[[help]]
keywords = ["rite", "rites"]
description = """
Syntax: rite
        rite begin
        rite complete

Used before a tier 2 master in the Hall of Rites (down from the Temple
of Thoth). 'rite' hears the master's terms and your progress, 'rite
begin' takes up that rite (abandoning any other), and 'rite complete'
ascends you once the deed is done. You must have rerolled first.
"""
see_also = ["reroll", "powers"]

[[help]]
keywords = ["powers", "inpart", "disciplines", "gifts", "spheres", "katas"]
description = """
Syntax: powers
        powers <power>

Tier 2 classes develop supernatural powers instead of levelling skills.
'powers' lists your class's powers, their costs and which you own;
'powers <name>' buys one. Some powers require another first.

Every kill earns currency equal to the victim's level: demonic power,
blood, rage, quintessence, quickening or grace. Passive powers work at
once; active powers unlock a command (see 'help travel', 'help forms',
'help inferno').
"""
see_also = ["travel", "forms", "inferno", "demonarmour"]

[[help]]
keywords = ["travel", "mist", "moonbridge", "correspondence"]
description = """
Syntax: travel <player>

With a travel power (demon travel, vampire mist, werewolf moonbridge,
magus correspondence, angel travel) you step across the world to any
player. Costs 50 movement. Blocked from no-recall rooms and into
private or solitary rooms.
"""
see_also = ["powers"]

[[help]]
keywords = ["forms", "demonform", "bloodrage", "crinos", "quickening", "angelform"]
description = """
Syntax: demonform | bloodrage | crinos | quickening | angelform

Each tier 2 class's ultimate power is a battle form lasting 8 ticks:
+5 hitroll and +10 damroll. Costs 50 movement; cannot be renewed while
it lasts.
"""
see_also = ["powers"]

[[help]]
keywords = ["inferno", "forcebolt", "smite"]
description = """
Syntax: inferno | forcebolt | smite

Demons (inferno, fire), magi (forcebolt, energy) and angels (smite,
holy) strike every hostile creature in the room at once. Costs 40 mana.
Not usable in safe rooms.
"""
see_also = ["powers"]

[[help]]
keywords = ["demonarmour", "demonarmor", "demonic armour"]
description = """
Syntax: demonarmour <tier> <slot>

The demon lord forges demonic armour for demons. Every piece costs 2000
demonic power; higher tiers also cost coin:
  black   free       grey    10 gold    purple   30 gold
  red     60 gold    brass  100 gold

Slots: ring collar plate helmet leggings boots gauntlets sleeves cape
belt bracer visor.

Each worn piece gives a demon +2 damroll. Purple, red and brass pieces
each give a 3, 4 or 5 percent chance that a hostile spell fizzles. Only
demons can wear it, and only the demon who forged it. Sacrificing a
piece drains its 2000 power back into you; the coin is lost.
"""
see_also = ["demon", "powers"]
